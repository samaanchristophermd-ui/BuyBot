name: Build Mac app

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine tests
        run: npm test
      - name: Electron driver test
        run: npm run test:electron
      - name: Build BuyBot.app (Apple Silicon + Intel)
        run: npx electron-builder --mac --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: BuyBot-mac
          path: dist/*.dmg
          if-no-files-found: error
